<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- La fuente va empaquetada (@fontsource/poppins) para funcionar sin internet -->
    <!-- Marca -->
    <title>Reloadex · Pokédex de Pokémon Reloaded</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Móvil / APK -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#172033" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Pokédex profesional de Pokémon Reloaded: todos los Pokémon, megas, formas, sprites, shiny, gritos, tipos, stats y evoluciones." />
    <meta name="application-name" content="Reloadex" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Reloadex" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no, email=no, address=no" />
    <meta name="msapplication-TileColor" content="#172033" />
    <meta name="msapplication-TileImage" content="/icons/icon-144.png" />
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #172033;
      }
      #app-splash img {
        width: 128px;
        height: 128px;
        border-radius: 32px;
        object-fit: cover;
        box-shadow: 0 24px 70px rgba(168, 85, 247, 0.45);
        animation: reloadex-splash-in 900ms cubic-bezier(0.16, 1, 0.3, 1) both,
                   reloadex-splash-float 2.4s ease-in-out 900ms infinite;
      }
      #app-splash span {
        font: 600 11px/1 Poppins, system-ui, sans-serif;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.65);
      }
      @keyframes reloadex-splash-in {
        from { opacity: 0; transform: scale(0.6) rotate(-12deg); }
        to { opacity: 1; transform: scale(1) rotate(0); }
      }
      @keyframes reloadex-splash-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-7px); }
      }
      @media (min-width: 640px) {
        #app-splash img { width: 160px; height: 160px; }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" aria-hidden="true">
      <img src="/logo-ui.png?v=2" alt="" />
      <span>Cargando…</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
