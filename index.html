<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- La fuente va empaquetada (@fontsource/poppins) para funcionar sin internet -->
    <!-- Marca -->
    <title>Reloadex · Pokédex de Pokémon Reloaded</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Móvil / APK -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Pokédex profesional de Pokémon Reloaded: todos los Pokémon, megas, formas, sprites, shiny, gritos, tipos, stats y evoluciones." />
    <meta name="application-name" content="Reloadex" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Reloadex" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no, email=no, address=no" />
    <meta name="msapplication-TileColor" content="#0A0A0A" />
    <meta name="msapplication-TileImage" content="/icons/icon-144.png" />
    <style>
      /* 🔴 SPLASH SCREEN CYBERPUNK - Rojo/Negro Tech */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #0A0A0A;
        overflow: hidden;
      }

      /* Fondo con líneas tech animadas */
      #app-splash::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: 
          repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(220, 20, 60, 0.03) 2px, rgba(220, 20, 60, 0.03) 4px),
          repeating-linear-gradient(90deg, transparent 0px, transparent 20px, rgba(220, 20, 60, 0.05) 20px, rgba(220, 20, 60, 0.05) 21px);
        animation: tech-grid-scroll 20s linear infinite;
      }

      /* Gradiente radial rojo desde el centro */
      #app-splash::after {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, rgba(220, 20, 60, 0.15) 0%, transparent 60%);
        animation: pulse-glow 3s ease-in-out infinite;
      }

      @keyframes tech-grid-scroll {
        0% { transform: translateY(0); }
        100% { transform: translateY(40px); }
      }

      @keyframes pulse-glow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.8; }
      }

      /* Logo con animación épica */
      #app-splash img {
        position: relative;
        z-index: 10;
        width: 140px;
        height: 140px;
        object-fit: cover;
        clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
        border: 3px solid #DC143C;
        box-shadow: 
          0 0 40px rgba(220, 20, 60, 0.8),
          0 0 80px rgba(220, 20, 60, 0.4),
          0 10px 60px rgba(0, 0, 0, 0.9),
          inset 0 0 20px rgba(220, 20, 60, 0.2);
        animation: 
          logo-entry 1.2s cubic-bezier(0.16, 1, 0.3, 1) both,
          logo-glitch 4s ease-in-out 1.2s infinite,
          logo-float 3s ease-in-out 1.2s infinite;
      }

      /* Efecto de esquinas tech en el logo */
      #app-splash .logo-wrapper {
        position: relative;
        z-index: 10;
      }

      #app-splash .logo-wrapper::before,
      #app-splash .logo-wrapper::after {
        content: '';
        position: absolute;
        width: 20px;
        height: 20px;
        border: 2px solid #DC143C;
        box-shadow: 0 0 10px rgba(220, 20, 60, 0.8);
        animation: corner-pulse 2s ease-in-out infinite;
      }

      #app-splash .logo-wrapper::before {
        top: -8px;
        left: -8px;
        border-right: none;
        border-bottom: none;
      }

      #app-splash .logo-wrapper::after {
        bottom: -8px;
        right: -8px;
        border-left: none;
        border-top: none;
      }

      @keyframes logo-entry {
        0% { 
          opacity: 0; 
          transform: scale(0.3) rotate(20deg);
          filter: blur(10px);
        }
        60% {
          transform: scale(1.1) rotate(-5deg);
        }
        100% { 
          opacity: 1; 
          transform: scale(1) rotate(0);
          filter: blur(0);
        }
      }

      @keyframes logo-glitch {
        0%, 90%, 100% {
          transform: translate(0, 0) scale(1);
        }
        92% {
          transform: translate(-2px, 1px) scale(1.01);
        }
        94% {
          transform: translate(2px, -1px) scale(0.99);
        }
        96% {
          transform: translate(-1px, -1px) scale(1.005);
        }
      }

      @keyframes logo-float {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        25% { transform: translateY(-8px) rotate(-2deg); }
        75% { transform: translateY(-8px) rotate(2deg); }
      }

      @keyframes corner-pulse {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.1); }
      }

      /* Texto de carga con efecto tech */
      #app-splash span {
        position: relative;
        z-index: 10;
        font: 700 13px/1 'Rajdhani', system-ui, sans-serif;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #C0C0C0;
        text-shadow: 
          0 0 10px rgba(220, 20, 60, 0.8),
          0 0 20px rgba(220, 20, 60, 0.4),
          0 2px 4px rgba(0, 0, 0, 0.9);
        animation: text-glitch 3s ease-in-out infinite;
      }

      @keyframes text-glitch {
        0%, 90%, 100% {
          opacity: 1;
          transform: translateX(0);
        }
        92% {
          opacity: 0.8;
          transform: translateX(-2px);
        }
        94% {
          opacity: 0.9;
          transform: translateX(2px);
        }
      }

      /* Línea de escaneo horizontal */
      #app-splash .scan-line {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, transparent 0%, #DC143C 50%, transparent 100%);
        box-shadow: 0 0 20px rgba(220, 20, 60, 0.8);
        animation: scan-move 3s linear infinite;
        z-index: 5;
      }

      @keyframes scan-move {
        0% { 
          top: 0%; 
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        90% {
          opacity: 1;
        }
        100% { 
          top: 100%;
          opacity: 0;
        }
      }

      /* Partículas de fondo */
      #app-splash .particle {
        position: absolute;
        width: 2px;
        height: 2px;
        background: #DC143C;
        box-shadow: 0 0 6px rgba(220, 20, 60, 0.8);
        animation: particle-float 8s ease-in-out infinite;
        z-index: 1;
      }

      @keyframes particle-float {
        0%, 100% {
          transform: translateY(0) translateX(0);
          opacity: 0;
        }
        10%, 90% {
          opacity: 1;
        }
        50% {
          transform: translateY(-100vh) translateX(50px);
        }
      }

      @media (min-width: 640px) {
        #app-splash img { 
          width: 180px; 
          height: 180px; 
        }
        #app-splash span {
          font-size: 15px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" aria-hidden="true">
      <!-- Línea de escaneo -->
      <div class="scan-line"></div>
      
      <!-- Partículas flotantes -->
      <div class="particle" style="left: 10%; animation-delay: 0s;"></div>
      <div class="particle" style="left: 30%; animation-delay: 2s;"></div>
      <div class="particle" style="left: 50%; animation-delay: 4s;"></div>
      <div class="particle" style="left: 70%; animation-delay: 1s;"></div>
      <div class="particle" style="left: 90%; animation-delay: 3s;"></div>
      
      <!-- Logo con esquinas tech -->
      <div class="logo-wrapper">
        <img src="/logo-ui.png?v=2" alt="" />
      </div>
      
      <span>CARGANDO...</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
